# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/pod_v1.json
apiVersion: v1
kind: Pod
metadata:
  name: nvidia-smi
spec:
  resourceClaims:
    - name: my-gpu-claim
      resourceClaimTemplateName: test-nvidia-gpu
  runtimeClassName: nvidia
  restartPolicy: Never
  containers:
    - name: nvidia-smi
      image: nvcr.io/nvidia/cuda:12.5.0-base-ubuntu22.04
      command: ["nvidia-smi"]
      resources:
        claims:
          - name: my-gpu-claim
